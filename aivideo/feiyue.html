<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 视频作品示例 · 飞跃湛江</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0f14; color: #e8eef5; font-family: "Microsoft YaHei", sans-serif; min-height: 100vh; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 36px 20px 60px; }
  .tag { display: inline-block; border: 1px solid #3aa3ff; color: #7cc4ff; font-size: 12px; letter-spacing: 2px; padding: 4px 14px; border-radius: 16px; margin-bottom: 16px; }
  h1 { font-size: 34px; letter-spacing: 3px; margin-bottom: 8px; }
  .sub { color: #93a4b5; font-size: 14px; margin-bottom: 26px; }
  video { width: 100%; border-radius: 10px; background: #000; box-shadow: 0 8px 40px rgba(0,0,0,.5); }
  .tips { margin-top: 28px; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
  .tip { background: #131c26; border: 1px solid #22303f; border-radius: 10px; padding: 16px; }
  .tip b { color: #7cc4ff; font-size: 14px; display: block; margin-bottom: 6px; }
  .tip span { color: #b8c6d4; font-size: 13px; line-height: 1.7; }
  .back { display: inline-block; margin-top: 26px; color: #7cc4ff; text-decoration: none; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="tag">AI 视频作品示例</div>
  <h1>飞跃湛江</h1>
  <div class="sub">城市风光 · 2:1 宽银幕 · 光色叙事（黎明→白天→黄昏→夜景）· 时长 1分27秒</div>
  <video controls preload="metadata" poster="feiyue_poster.jpg">
    <source src="video/feiyue_zhanjiang.mp4" type="video/mp4">
  </video>
  <div class="tips">
    <div class="tip"><b>比例定调</b><span>2:1 超宽银幕比例，一开场就定电影感基调</span></div>
    <div class="tip"><b>光色叙事</b><span>用一天的光线变化推进时间线，无需复杂分镜</span></div>
    <div class="tip"><b>统一色调</b><span>全片锁定氛围色，AI 生成更稳定、画面更统一</span></div>
    <div class="tip"><b>音乐铺底</b><span>全程连续 BGM，音画同步提升完成度</span></div>
  </div>
  <a class="back" href="index.html">← 返回列表</a>
</div>
</body>
</html>
