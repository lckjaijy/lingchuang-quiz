<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 视频作品示例</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0f14; color: #e8eef5; font-family: "Microsoft YaHei", sans-serif; min-height: 100vh; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 44px 20px 60px; }
  h1 { font-size: 32px; letter-spacing: 4px; margin-bottom: 8px; text-align: center; }
  .sub { text-align: center; color: #93a4b5; font-size: 14px; margin-bottom: 40px; }
  .card { display: flex; gap: 22px; background: #111922; border: 1px solid #22303f; border-radius: 14px; padding: 22px; margin-bottom: 22px; align-items: center; }
  .card img { width: 280px; border-radius: 8px; flex-shrink: 0; }
  .card .info h2 { font-size: 22px; margin-bottom: 8px; }
  .card .info p { color: #a8b8c8; font-size: 13.5px; line-height: 1.8; }
  .card .info a { display: inline-block; margin-top: 12px; color: #7cc4ff; text-decoration: none; border: 1px solid #3aa3ff; padding: 7px 20px; border-radius: 20px; font-size: 13px; }
  .card .info a:hover { background: #3aa3ff; color: #0a0f14; }
  @media (max-width: 700px) { .card { flex-direction: column; } .card img { width: 100%; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>AI 视频作品示例</h1>
  <div class="sub">2026 湛江市"红树林之城"AIGC 技术综合创作赛 · 培训素材</div>
  <div class="card">
    <img src="feiyue_poster.jpg" alt="飞跃湛江">
    <div class="info">
      <h2>飞跃湛江</h2>
      <p>城市风光 AI 视频 · 2:1 宽银幕 · 光色叙事 · 1分27秒</p>
      <a href="feiyue.html">观看视频 →</a>
    </div>
  </div>
  <div class="card">
    <img src="xunji_poster.jpg" alt="寻迹鹏城温情">
    <div class="info">
      <h2>寻迹鹏城温情</h2>
      <p>城市人文 AI 视频 · 1080P 全高清 · 暖橙氛围 · 1分49秒</p>
      <a href="xunji.html">观看视频 →</a>
    </div>
  </div>
</div>
</body>
</html>
