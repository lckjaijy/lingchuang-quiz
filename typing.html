<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打字练习</title>

<style>
  /* ===== CSS Variables ===== */
  :root {
    --bg:       #0d1117;
    --surface:  #161b22;
    --surface2: #1e2530;
    --border:   #30363d;
    --text:     #e6edf3;
    --muted:    #7d8590;
    --correct:  #3fb950;
    --error:    #f85149;
    --cursor:   #f0883e;
    --accent:   #58a6ff;
    --accent2:  #bc8cff;
    --key-bg:   #21262d;
    --key-fg:   #c9d1d9;
    --key-hl:   #f0883e;
    --radius:   12px;
    --shadow:   0 4px 24px rgba(0,0,0,0.5);
    --btn-primary-text: #0d1117;
    --pill-active-text: #0d1117;
    --left-key-bg:   #162032;
    --left-key-bd:   #1f3a5f;
    --left-key-fg:   #6cb3ff;
    --right-key-bg:  #1a1632;
    --right-key-bd:  #3a2f5f;
    --right-key-fg:  #bc8cff;
    --key-border-bottom: rgba(0,0,0,0.4);
    --body-grad1: rgba(88,166,255,0.06);
    --body-grad2: rgba(188,140,255,0.05);
    --completion-bg: linear-gradient(135deg, rgba(63,185,80,0.15), rgba(88,166,255,0.15));
  }

  /* ===== Light Theme ===== */
  [data-theme="light"] {
    --bg:       #f4f6f9;
    --surface:  #ffffff;
    --surface2: #eef1f6;
    --border:   #d5dbe5;
    --text:     #1e2d3d;
    --muted:    #6b7a8d;
    --correct:  #16a34a;
    --error:    #dc2626;
    --cursor:   #ea580c;
    --accent:   #2563eb;
    --accent2:  #7c3aed;
    --key-bg:   #e8ecf2;
    --key-fg:   #374151;
    --key-hl:   #f97316;
    --shadow:   0 4px 24px rgba(0,0,0,0.08);
    --btn-primary-text: #ffffff;
    --pill-active-text: #ffffff;
    --left-key-bg:   #e0ecf8;
    --left-key-bd:   #b8d4f0;
    --left-key-fg:   #1d4ed8;
    --right-key-bg:  #ece5f8;
    --right-key-bd:  #cbb8f0;
    --right-key-fg:  #6d28d9;
    --key-border-bottom: rgba(0,0,0,0.1);
    --body-grad1: rgba(37,99,235,0.05);
    --body-grad2: rgba(124,58,237,0.04);
    --completion-bg: linear-gradient(135deg, rgba(22,163,74,0.1), rgba(37,99,235,0.1));
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Sora', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
    background-image:
      radial-gradient(ellipse 60% 40% at 20% 10%, var(--body-grad1) 0%, transparent 70%),
      radial-gradient(ellipse 40% 30% at 80% 90%, var(--body-grad2) 0%, transparent 60%);
  }

  /* ===== Header ===== */
  header {
    width: 100%;
    max-width: 900px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .title-block { display: flex; flex-direction: column; justify-content: center; }
  .main-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(1.4rem, 3vw, 2rem);
    font-weight: 700;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--text);
    line-height: 1;
  }
  .main-title-sub {
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-top: 5px;
    font-weight: 300;
  }

  /* ===== Stats Panel ===== */
  .stats {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 20px;
    text-align: center;
    min-width: 80px;
    transition: border-color 0.2s;
  }
  .stat-card:hover { border-color: var(--accent); }
  .stat-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .stat-val.green { color: var(--correct); }
  .stat-val.orange { color: var(--key-hl); }
  .stat-val.purple { color: var(--accent2); }
  .stat-label { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

  /* ===== Main Area ===== */
  main {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ===== Word Display ===== */
  .word-display-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    text-align: center;
    position: relative;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow);
  }
  .word-category-tag {
    position: absolute;
    top: 12px;
    left: 16px;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    background: var(--surface2);
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }
  .word-progress-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 0 0 var(--radius) var(--radius);
    transition: width 0.3s ease;
  }
  #word-display {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(1rem, 2.5vw, 1.5rem);
    font-weight: 600;
    letter-spacing: 2px;
    line-height: 1.8;
    user-select: none;
    white-space: pre;
    text-align: left;
    width: 100%;
  }
  #word-display .char { transition: color 0.08s; }
  #word-display .char.correct { color: var(--correct); }
  #word-display .char.error   { color: var(--error); text-decoration: underline wavy var(--error); }
  #word-display .char.cursor  { position: relative; }
  #word-display .char.cursor::after {
    content: '';
    position: absolute;
    left: 0; top: 0;
    width: 100%; height: 100%;
    background: var(--cursor);
    opacity: 0.25;
    border-radius: 3px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 0%,100%{opacity:.25} 50%{opacity:0} }

  .word-hint { font-size: 0.8rem; color: var(--muted); margin-top: 10px; }

  /* ===== Input Box ===== */
  .input-wrap {
    position: relative;
    display: flex;
    gap: 10px;
  }
  #typing-input {
    flex: 1;
    background: var(--surface);
    border: 2px solid var(--border);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.1rem;
    padding: 14px 20px;
    border-radius: var(--radius);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    letter-spacing: 2px;
  }
  #typing-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,0.15); }
  #typing-input.input-error { border-color: var(--error) !important; box-shadow: 0 0 0 3px rgba(248,81,73,0.15) !important; }
  #typing-input:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ===== Buttons ===== */
  .btn {
    font-family: 'Sora', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    padding: 12px 20px;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    transition: transform 0.1s, opacity 0.15s, box-shadow 0.15s;
    letter-spacing: 0.5px;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: var(--btn-primary-text); }
  .btn-primary:hover { box-shadow: 0 0 16px rgba(88,166,255,0.4); }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger { background: var(--surface2); color: var(--error); border: 1px solid var(--border); }
  .btn-danger:hover { border-color: var(--error); }

  /* ===== Controls Row ===== */
  .controls {
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }
  .controls-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .controls-row + .controls-row {
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .controls-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-right: 4px; }
  .sep { width: 1px; height: 28px; background: var(--border); }
  .pill-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill {
    font-family: 'Sora', sans-serif;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .pill:hover { color: var(--text); border-color: var(--accent); }
  .pill.active { background: var(--accent); color: var(--pill-active-text); border-color: var(--accent); }
  .pill.active.green { background: var(--correct); border-color: var(--correct); }
  .pill.active.orange { background: var(--key-hl); border-color: var(--key-hl); }
  .pill.active.purple { background: var(--accent2); border-color: var(--accent2); }

  /* ===== Keyboard ===== */
  .keyboard-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }
  .keyboard-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .keyboard-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .kb-row { display: flex; justify-content: center; gap: 5px; margin-bottom: 5px; }
  .key {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    font-weight: 600;
    min-width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--key-bg);
    border: 1px solid var(--border);
    border-bottom: 3px solid var(--key-border-bottom);
    border-radius: 6px;
    color: var(--key-fg);
    transition: all 0.1s;
    user-select: none;
  }
  .key.left-hand  { background: var(--left-key-bg); border-color: var(--left-key-bd); color: var(--left-key-fg); }
  .key.right-hand { background: var(--right-key-bg); border-color: var(--right-key-bd); color: var(--right-key-fg); }
  .key.highlight  {
    background: var(--key-hl) !important;
    border-color: #c06820 !important;
    color: var(--btn-primary-text) !important;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(240,136,62,0.5);
  }
  .key.space-key { min-width: 180px; }
  .key.wide { min-width: 56px; }
  .key.wider { min-width: 70px; }

  /* ===== Completion Banner ===== */
  .completion-banner {
    display: none;
    background: var(--completion-bg);
    border: 1px solid var(--correct);
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
    animation: fadeIn 0.4s ease;
  }
  .completion-banner.show { display: block; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
  .completion-banner h3 { font-size: 1.3rem; color: var(--correct); margin-bottom: 6px; }
  .completion-banner p { color: var(--muted); font-size: 0.9rem; }

  /* Correct flash */
  @keyframes correctFlash {
    0%   { background: rgba(63,185,80,0.2); }
    100% { background: transparent; }
  }
  .flash-correct { animation: correctFlash 0.35s ease; }

  /* ===== Theme Toggle ===== */
  .theme-toggle {
    position: relative;
    width: 52px; height: 28px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.3s;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding: 0 4px;
  }
  .theme-toggle:hover { border-color: var(--accent); }
  .theme-toggle .toggle-thumb {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--accent);
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), background 0.3s;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.65rem;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  [data-theme="light"] .theme-toggle .toggle-thumb {
    transform: translateX(22px);
  }
  .theme-toggle .toggle-icon { line-height: 1; }
  .theme-label {
    font-size: 0.62rem; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.5px; font-weight: 600; margin-right: 6px; white-space: nowrap;
  }
  .theme-group {
    display: flex; align-items: center; gap: 0;
  }

  /* ===== Responsive ===== */
  @media(max-width:640px) {
    header { flex-direction: column; gap: 16px; align-items: flex-start; }
    .stats { gap: 8px; }
    .stat-card { padding: 10px 14px; min-width: 64px; }
    .stat-val { font-size: 1.3rem; }
    .key { min-width: 26px; height: 28px; font-size: 0.6rem; }
    .key.space-key { min-width: 120px; }
    .key.wide { min-width: 40px; }
    .key.wider { min-width: 50px; }
    .kb-row { gap: 3px; }
  }
</style>

<body>

<!-- ===== HEADER ===== -->
<header>
  <div class="title-block">
    <div class="main-title">打字练习</div>
    <div class="main-title-sub">TYPING PRACTICE</div>
  </div>
  <div class="theme-group">
    <span class="theme-label">主题</span>
    <div class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换深色/浅色主题">
      <div class="toggle-thumb"><span class="toggle-icon">🌙</span></div>
    </div>
  </div>
  <div class="stats">
    <div class="stat-card">
      <div class="stat-val" id="stat-wpm">0</div>
      <div class="stat-label">字/分钟</div>
    </div>
    <div class="stat-card">
      <div class="stat-val green" id="stat-acc">—</div>
      <div class="stat-label">正确率</div>
    </div>
    <div class="stat-card">
      <div class="stat-val orange" id="stat-time">0s</div>
      <div class="stat-label">时间</div>
    </div>
    <div class="stat-card">
      <div class="stat-val purple" id="stat-progress">0/0</div>
      <div class="stat-label">进度</div>
    </div>
  </div>
</header>

<!-- ===== MAIN ===== -->
<main>

  <!-- Word Display -->
  <div class="word-display-wrap" id="display-wrap">
    <div class="word-category-tag" id="category-tag">简单词库</div>
    <div id="word-display">按「开始」开始练习</div>
    <div class="word-progress-bar" id="progress-bar" style="width:0%"></div>
  </div>

  <!-- Completion Banner -->
  <div class="completion-banner" id="completion-banner">
    <h3>🎉 本轮完成！</h3>
    <p id="completion-msg">点击「开始」重新练习</p>
  </div>

  <!-- Input -->
  <div class="input-wrap">
    <input
      type="text"
      id="typing-input"
      placeholder="在此输入…"
      disabled
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
    />
    <button class="btn btn-secondary" id="btn-next" disabled>跳过</button>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="controls-row">
      <button class="btn btn-primary" id="btn-start">▶ 开始</button>
      <button class="btn btn-danger"  id="btn-reset">↺ 重置</button>
      <div class="sep"></div>
      <span class="controls-label">词库</span>
      <div class="pill-group" id="category-pills">
        <div class="pill active" data-cat="easy">简单</div>
        <div class="pill" data-cat="hard">困难</div>
        <div class="pill" data-cat="python">Python</div>
        <div class="pill" data-cat="cpp">C++</div>
      </div>
      <div class="sep"></div>
      <span class="controls-label">数量</span>
      <div class="pill-group" id="count-pills">
        <div class="pill active" data-count="10">10</div>
        <div class="pill" data-count="20">20</div>
        <div class="pill" data-count="30">30</div>
      </div>
    </div>
  </div>

  <!-- Keyboard -->
  <div class="keyboard-section">
    <div class="keyboard-title">键盘提示</div>
    <div id="keyboard"></div>
  </div>

</main>

<script>
// ==================== THEME TOGGLE ====================
function toggleTheme() {
  const html = document.documentElement;
  const isLight = html.getAttribute('data-theme') === 'light';
  if (isLight) {
    html.removeAttribute('data-theme');
    document.querySelector('.toggle-icon').textContent = '🌙';
  } else {
    html.setAttribute('data-theme', 'light');
    document.querySelector('.toggle-icon').textContent = '☀️';
  }
}

    '#include <iostream>\nusing namespace std;\nint main() {\n    int num;\n    cout << "输入一个整数：";\n    cin >> num;\n    if (num % 2 == 0)\n        cout << num << " 是偶数" << endl;\n    else\n        cout << num << " 是奇数" << endl;\n    return 0;\n}',
    '#include <iostream>\nusing namespace std;\nint main() {\n    for (int i = 1; i <= 9; i++) {\n        for (int j = 1; j <= i; j++) {\n            cout << j << "*" << i << "=" << i*j << "\\t";\n        }\n        cout << endl;\n    }\n    return 0;\n}',
    '#include <iostream>\nusing namespace std;\nint main() {\n    int arr[] = {34, 67, 23, 89, 12};\n    int size = sizeof(arr) / sizeof(arr[0]);\n    int maxVal = arr[0];\n    for (int i = 1; i < size; i++) {\n        if (arr[i] > maxVal)\n            maxVal = arr[i];\n    }\n    cout << "最大值是：" << maxVal << endl;\n    return 0;\n}'
  ]
};

const categoryNames = {
  easy:   '简单词库',
  hard:   '困难句子',
  python: 'Python 词库',
  cpp:    'C++ 词库'
};

// ==================== KEYBOARD LAYOUT ====================
const rows = [
  ['`','1','2','3','4','5','6','7','8','9','0','-','=','⌫'],
  ['Tab','q','w','e','r','t','y','u','i','o','p','[',']','\\'],
  ['Caps','a','s','d','f','g','h','j','k','l',';',"'",'↵'],
  ['⇧','z','x','c','v','b','n','m',',','.','/','⇧'],
  ['Space']
];

// Left hand keys (on QWERTY)
const leftKeys  = new Set(['`','1','2','3','4','5','q','w','e','r','t','a','s','d','f','g','z','x','c','v','b']);
const rightKeys = new Set(['6','7','8','9','0','-','=','y','u','i','o','p','[',']','\\','h','j','k','l',';',"'",'n','m',',','.','/']);

function buildKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  rows.forEach((row, ri) => {
    const rowEl = document.createElement('div');
    rowEl.className = 'kb-row';
    row.forEach(k => {
      const el = document.createElement('div');
      el.className = 'key';
      const kl = k.toLowerCase();
      if (leftKeys.has(kl))  el.classList.add('left-hand');
      if (rightKeys.has(kl)) el.classList.add('right-hand');
      if (k === 'Space')     { el.classList.add('space-key'); el.dataset.key = ' '; }
      else if (k === '⌫')   { el.classList.add('wide'); el.dataset.key = 'backspace'; }
      else if (k === 'Tab')  { el.classList.add('wide'); el.dataset.key = 'tab'; }
      else if (k === 'Caps') { el.classList.add('wider'); el.dataset.key = 'capslock'; }
      else if (k === '↵')   { el.classList.add('wide'); el.dataset.key = 'enter'; }
      else if (k === '⇧')   { el.classList.add('wider'); el.dataset.key = 'shift'; }
      else                   { el.dataset.key = kl; }
      el.textContent = k;
      kb.appendChild(el);
      rowEl.appendChild(el);
    });
    kb.appendChild(rowEl);
  });
}

function highlightKey(char) {
  document.querySelectorAll('.key').forEach(k => k.classList.remove('highlight'));
  if (!char) return;
  const target = char === ' ' ? ' ' : char.toLowerCase();
  document.querySelectorAll('.key').forEach(k => {
    if (k.dataset.key === target) k.classList.add('highlight');
  });
}

// ==================== STATE ====================
let currentCategory    = 'easy';
let wordCount          = 10;
let wordList           = [];
let wordIndex          = 0;
let currentWord        = '';
let totalWords         = 0;

// Accuracy: tracked per-keystroke in keydown
let totalKeystrokes    = 0;  // every printable key + backspace pressed
let correctKeystrokes  = 0;  // keys that matched expected char at position

// WPM: based on correctly-finished chars
let correctChars       = 0;

let timerInterval      = null;
let secondsElapsed     = 0;
let started            = false;
let running            = false;

// ==================== DOM ====================
const wordDisplay      = document.getElementById('word-display');
const input            = document.getElementById('typing-input');
const btnStart         = document.getElementById('btn-start');
const btnReset         = document.getElementById('btn-reset');
const btnNext          = document.getElementById('btn-next');
const progressBar      = document.getElementById('progress-bar');
const categoryTag      = document.getElementById('category-tag');
const completionBanner = document.getElementById('completion-banner');
const completionMsg    = document.getElementById('completion-msg');
const statWpm          = document.getElementById('stat-wpm');
const statAcc          = document.getElementById('stat-acc');
const statTime         = document.getElementById('stat-time');
const statProgress     = document.getElementById('stat-progress');

// ==================== HELPERS ====================
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function formatTime(s) {
  if (s < 60) return s + 's';
  return Math.floor(s/60) + 'm' + (s%60).toString().padStart(2,'0') + 's';
}

function renderWord(word, typed) {
  wordDisplay.innerHTML = '';
  for (let i = 0; i < word.length; i++) {
    const span = document.createElement('span');
    span.className = 'char';
    span.textContent = word[i];
    if (i < typed.length) {
      span.classList.add(typed[i] === word[i] ? 'correct' : 'error');
    } else if (i === typed.length) {
      span.classList.add('cursor');
    }
    wordDisplay.appendChild(span);
  }
  // Highlight next key
  const nextChar = word[typed.length] || null;
  highlightKey(nextChar);
}

function updateStats() {
  const minutes = secondsElapsed / 60 || 0.0001;
  // 字/分钟: total correctly-typed characters (from completed words) divided by elapsed minutes
  const cpm = Math.round(correctChars / minutes);
  // Accuracy: correct keystrokes / total keystrokes * 100
  const acc = totalKeystrokes > 0
    ? Math.round((correctKeystrokes / totalKeystrokes) * 100)
    : 0;

  statWpm.textContent      = started ? cpm  : '0';
  statAcc.textContent      = started ? acc + '%' : '—';
  statTime.textContent     = formatTime(secondsElapsed);
  statProgress.textContent = wordIndex + '/' + wordCount;
  progressBar.style.width  = wordCount > 0
    ? (Math.min(wordIndex, wordCount) / wordCount * 100) + '%'
    : '0%';
}

function startTimer() {
  if (timerInterval) return;
  timerInterval = setInterval(() => {
    secondsElapsed++;
    updateStats();
  }, 1000);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function loadWord() {
  if (wordIndex >= wordList.length) {
    // Round complete
    completionBanner.classList.add('show');
    completionMsg.textContent =
      `完成 ${totalWords} 个词 | 速度 ${statWpm.textContent} 字/分钟 | 正确率 ${statAcc.textContent}`;
    input.disabled = true;
    btnNext.disabled = true;
    stopTimer();
    running = false;
    wordDisplay.textContent = '✓ 全部完成';
    wordDisplay.style.fontSize = '';
    wordDisplay.style.textAlign = 'center';
    highlightKey(null);
    return;
  }

  const raw = wordList[wordIndex];
  // 多行片段：逐行拆开，每行单独作为一个练习项
  // 已在 initRound 中展开，currentWord 始终是单行
  currentWord = raw;
  input.value = '';
  input.classList.remove('input-error');

  // 动态字号
  const isShort = currentWord.length <= 4;
  if (isShort) {
    wordDisplay.style.fontSize = 'clamp(2.5rem, 5vw, 3.5rem)';
    wordDisplay.style.letterSpacing = '8px';
    wordDisplay.style.textAlign = 'center';
  } else if (currentWord.length <= 20) {
    wordDisplay.style.fontSize = 'clamp(1.4rem, 3vw, 2rem)';
    wordDisplay.style.letterSpacing = '3px';
    wordDisplay.style.textAlign = 'center';
  } else {
    wordDisplay.style.fontSize = 'clamp(0.9rem, 1.8vw, 1.2rem)';
    wordDisplay.style.letterSpacing = '1.5px';
    wordDisplay.style.textAlign = 'left';
  }

  renderWord(currentWord, '');
}

function initRound() {
  stopTimer();
  secondsElapsed    = 0;
  started           = false;
  running           = true;
  correctChars      = 0;
  totalKeystrokes   = 0;
  correctKeystrokes = 0;
  wordIndex         = 0;

  const bank = wordBanks[currentCategory];
  const picked = shuffle(bank).slice(0, Math.min(wordCount, bank.length));

  // 多行代码片段展开为逐行，过滤空行和单独的 }
  wordList = [];
  picked.forEach(item => {
    if (item.includes('\n')) {
      item.split('\n').forEach(line => {
        const t = line.trim();
        if (t === '' || t === '}') return;          // 跳过空行和单独的右大括号
        // 末尾只有 { 的行补上 }
        const normalized = t.endsWith('{') ? t + '}' : t;
        wordList.push(normalized);
      });
    } else {
      wordList.push(item);
    }
  });

  // 多行代码片段展开后仍须遵守用户选择的练习数量。
  wordList = wordList.slice(0, wordCount);
  totalWords = wordList.length;

  completionBanner.classList.remove('show');
  input.disabled  = false;
  btnNext.disabled= false;
  updateStats();
  loadWord();
  input.focus();
}

// ==================== INPUT HANDLER ====================
input.addEventListener('input', () => {
  if (!running) return;

  const typed = input.value;

  // Start timer on first keystroke
  if (!started && typed.length > 0) {
    started = true;
    startTimer();
  }

  renderWord(currentWord, typed);

  const isCorrect = currentWord.startsWith(typed);
  input.classList.toggle('input-error', !isCorrect && typed.length > 0);

  // Completed word — all chars typed AND they all match
  if (typed === currentWord) {
    correctChars += currentWord.length;
    wordIndex++;

    // Flash animation
    const wrap = document.getElementById('display-wrap');
    wrap.classList.remove('flash-correct');
    void wrap.offsetWidth;
    wrap.classList.add('flash-correct');

    updateStats();
    loadWord();
  }
});

// Keystroke counting for ACCURACY — this is the single source of truth
// We track every meaningful key: printable chars and backspace
input.addEventListener('keydown', e => {
  if (!running) return;

  if (e.key === 'Backspace') {
    // Backspace counts as a keystroke (mistake correction)
    if (input.value.length > 0) {
      totalKeystrokes++;
      // Backspace is never a "correct" key press
    }
    return;
  }

  if (e.key.length !== 1) return; // ignore ctrl, shift, etc.

  totalKeystrokes++;
  const pos = input.value.length; // position BEFORE this char is added
  if (pos < currentWord.length && e.key === currentWord[pos]) {
    correctKeystrokes++;
  }
});

// Skip word
btnNext.addEventListener('click', () => {
  if (!running) return;
  // Skipping counts remaining untyped chars as missed keystrokes
  const typedSoFar = input.value.length;
  const remaining  = currentWord.length - typedSoFar;
  if (remaining > 0) totalKeystrokes += remaining; // missed keys count against accuracy
  wordIndex++;
  input.value = '';
  input.classList.remove('input-error');
  loadWord();
  updateStats();
  input.focus();
});

// Start
btnStart.addEventListener('click', () => {
  initRound();
});

// Reset
btnReset.addEventListener('click', () => {
  initRound();
});

// Category pills
document.getElementById('category-pills').addEventListener('click', e => {
  const pill = e.target.closest('.pill');
  if (!pill) return;
  document.querySelectorAll('#category-pills .pill').forEach(p => p.classList.remove('active'));
  pill.classList.add('active');
  currentCategory = pill.dataset.cat;
});

// Count pills
document.getElementById('count-pills').addEventListener('click', e => {
  const pill = e.target.closest('.pill');
  if (!pill) return;
  document.querySelectorAll('#count-pills .pill').forEach(p => p.classList.remove('active'));
  pill.classList.add('active');
  wordCount = parseInt(pill.dataset.count);
});

// ==================== INIT ====================
buildKeyboard();
updateStats();
wordDisplay.innerHTML = '<span style="color:var(--muted);font-size:1.5rem;letter-spacing:2px">按「开始」开始练习</span>';
</script>
</body>
</html>
