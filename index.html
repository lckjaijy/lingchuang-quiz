<!DOCTYPE html>

<title>岭创编程练习工具</title>
<style>

  .wrap { max-width:520px; margin:0 auto; }

  .card { display:flex; align-items:center; gap:16px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12); border-radius:16px; padding:20px; text-decoration:none; color:#eee; transition:.2s; }
  .card:active { transform:scale(.98); background:rgba(255,255,255,.12); }
  .icon { width:56px; height:56px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:30px; flex-shrink:0; }
  .i1 { background:#2d6cdf; } .i2 { background:#23a87e; } .i3 { background:#e6a516; }
  .info h2 { font-size:18px; margin-bottom:4px; }
  .info p { font-size:12.5px; color:#aab4c8; line-height:1.5; }
  .note { margin-top:28px; background:rgba(255,255,255,.05); border-radius:12px; padding:14px 16px; font-size:12px; color:#9aa5b8; line-height:1.8; }
  .foot { text-align:center; margin-top:24px; font-size:11px; color:#6b7690; }

<div class="wrap">
